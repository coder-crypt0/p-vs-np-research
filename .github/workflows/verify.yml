name: Verify research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run Python experiments
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -B experiments/check_parity.py
          python -B experiments/check_local_relaxation.py
          python -B experiments/check_cographic.py
          python -B experiments/check_permanent_jets.py
          python -B experiments/check_paired_permanent.py
          python -B experiments/check_determinant_filter.py
          python -B experiments/check_sign_filter_limits.py
          python -B experiments/check_block_filter.py
          python -B experiments/check_pair_filter.py
      - name: Install pinned Lean release
        shell: bash
        run: |
          toolchain=$(cat lean-toolchain)
          version=${toolchain#leanprover/lean4:v}
          release="lean-$version-linux"
          archive="$RUNNER_TEMP/$release.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/leanprover/lean4/releases/download/v$version/$release.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$release/bin" >> "$GITHUB_PATH"
      - name: Check Lean proofs
        run: |
          lean -DwarningAsError=true --root=proofs -o "$RUNNER_TEMP/ExactOne.olean" proofs/ExactOne.lean
          lean -DwarningAsError=true --root=proofs -o "$RUNNER_TEMP/LocalGadget.olean" proofs/LocalGadget.lean
          lean -DwarningAsError=true proofs/Cographic.lean
          LEAN_PATH="$RUNNER_TEMP" lean -DwarningAsError=true --root=proofs proofs/ReduceThreeSAT.lean
