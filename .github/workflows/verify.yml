name: Verify research

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run Python experiments
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -B experiments/check_parity.py
          python -B experiments/check_local_relaxation.py
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Check Lean proofs
        run: |
          lean -DwarningAsError=true proofs/ExactOne.lean
          lean -DwarningAsError=true proofs/LocalGadget.lean
